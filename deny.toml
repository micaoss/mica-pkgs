# cargo-deny 0.19.x configuration for the mica-pkgs workspace.

[licenses]
# All workspace crates are publish = false; skip license checks for them.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # tiny-keccak 2.0.2, and only tiny-keccak. CC0-1.0 is a public-domain
    # dedication rather than a licence with obligations, and it is reached
    # here through a proc macro's build-time dependency, not through anything
    # linked into a shipped binary. It is also a dedication that explicitly
    # does NOT grant patent rights, which is the consideration that actually
    # applies to a device shipped to customers and the reason this entry names
    # one crate on one chain rather than opening the list to a licence:
    #
    #   rumqttd -> config -> rust-ini -> ordered-multimap -> dlv-list
    #           -> const-random -> const-random-macro -> tiny-keccak
    #
    # `config` is a mandatory dependency of rumqttd, so no feature flag drops
    # the chain. Reversing this allowance therefore starts upstream, not here:
    # ask first whether rumqttd can be driven without its `config`-based
    # loader, and only if that answer is no does the alternative become not
    # using the broker.
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
# Every dependency of a shipped binary is pure Rust; OpenSSL and native-tls are refused.
deny = [
    { crate = "openssl", reason = "no package here links a system TLS library" },
    { crate = "openssl-sys", reason = "no package here links a system TLS library" },
    { crate = "native-tls", reason = "no package here links a system TLS library" },
]

[advisories]
# Vulnerabilities are errors by default in the version-2 schema;
# unmaintained advisories only warn.
unmaintained = "all"
